[pytest]
pythonpath = .
testpaths = tests
# tests/dags needs `airflow` (deliberately not in requirements.txt -- it's isolated to the
# airflow container's own dependency set); norecursedirs keeps it out of bare `pytest`
# discovery here while still letting `docker compose exec airflow pytest tests/dags` collect
# it explicitly (norecursedirs only prunes recursive discovery, not explicit path arguments).
norecursedirs = dags
